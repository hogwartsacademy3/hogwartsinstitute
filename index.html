<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080706">
<meta name="description" content="An interactive Christmas memory.">
<title>Merry Christmas, Please Don't Call</title>

<style>
/* =========================================================
   COLORS
   Edit these variables to change the entire visual palette.
   ========================================================= */
:root {
    --black: #070605;
    --near-black: #0d0a08;
    --brown: #241914;
    --brown-soft: #34231b;
    --green: #17231d;
    --green-deep: #0d1712;
    --red: #5b2423;
    --cream: #e8dcc5;
    --cream-soft: #b9ab92;
    --gold: #d0a55a;
    --gold-soft: rgba(208,165,90,.45);
    --glass: rgba(14, 11, 9, .72);

    --scene-brightness: 1;
    --tree-light-opacity: .65;
    --window-glow: .4;
    --snow-opacity: .55;

    --ease-cinematic: cubic-bezier(.22,.61,.36,1);
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--black);
    color: var(--cream);
    font-family: Georgia, "Times New Roman", serif;
}

body {
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
input {
    font: inherit;
}

button {
    color: inherit;
}

button:focus-visible,
input:focus-visible,
.interactive:focus-visible {
    outline: 1px solid var(--gold);
    outline-offset: 5px;
}

/* =========================================================
   OPENING
   ========================================================= */

#opening {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: grid;
    place-items: center;
    background:
        radial-gradient(circle at 50% 45%, rgba(67,46,31,.13), transparent 38%),
        #050403;
    transition:
        opacity 1.5s var(--ease-cinematic),
        visibility 1.5s;
}

#opening.closed {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.opening-content {
    width: min(90vw, 600px);
    text-align: center;
    transform: translateY(-2vh);
}

.opening-date {
    margin-bottom: 30px;
    color: #756d60;
    font: 10px/1.5 Arial, sans-serif;
    letter-spacing: .32em;
}

.opening-title {
    margin: 0;
    color: #eee5d6;
    font-size: clamp(35px, 7vw, 70px);
    font-weight: 400;
    letter-spacing: .08em;
    line-height: .95;
}

.opening-subtitle {
    margin: 18px 0 48px;
    color: #8d8373;
    font-size: clamp(15px, 2vw, 19px);
    font-style: italic;
    letter-spacing: .12em;
}

.open-button {
    padding: 12px 20px;
    border: 0;
    background: transparent;
    color: #bdb3a2;
    cursor: pointer;
    font: 11px Arial, sans-serif;
    letter-spacing: .3em;
    transition: color .4s ease, transform .4s ease;
}

.open-button:hover {
    color: #eee5d6;
    transform: translateY(-2px);
}

/* =========================================================
   MAIN SCENE
   ========================================================= */

#experience {
    position: fixed;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.8s var(--ease-cinematic);
}

#experience.visible {
    opacity: 1;
    visibility: visible;
}

.scene {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 72%,
            rgba(100,62,36,.30),
            transparent 48%
        ),
        linear-gradient(
            to bottom,
            #0d0f12 0%,
            #121417 48%,
            #18120d 100%
        );
    filter: brightness(var(--scene-brightness));
    transition: filter 2s ease;
}

/* Subtle camera layer */
.camera {
    position: absolute;
    inset: -2%;
    transform:
        translate3d(var(--camera-x, 0px), var(--camera-y, 0px), 0)
        scale(1.025);
    transition: transform 1.2s var(--ease-cinematic);
    transform-origin: center;
}

/* =========================================================
   WALL / ROOM
   ========================================================= */

.wall {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.45),
            transparent 24%,
            transparent 75%,
            rgba(0,0,0,.55)
        ),
        linear-gradient(
            to bottom,
            #0e100f,
            #161614 65%,
            #1d150f
        );
}

.wall::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .18;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.015) 0 1px,
            transparent 1px 7px
        );
}

/* =========================================================
   WINDOW
   ========================================================= */

.window {
    position: absolute;
    left: 12%;
    top: 9%;
    width: min(44vw, 650px);
    height: min(58vh, 620px);
    min-height: 310px;
    cursor: pointer;
    transform: translate3d(var(--window-x, 0px), var(--window-y, 0px), 0);
    transition:
        transform 1.3s var(--ease-cinematic),
        filter .8s ease;
}

.window:hover {
    filter: brightness(1.08);
}

.window-frame {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border: 12px solid #17120e;
    background: #05070b;
    box-shadow:
        inset 0 0 40px rgba(0,0,0,.9),
        0 20px 50px rgba(0,0,0,.6);
}

.window-sky {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            circle at 72% 18%,
            rgba(218,220,208,.17),
            transparent 5%
        ),
        radial-gradient(
            circle at 72% 18%,
            rgba(224,220,198,.05),
            transparent 18%
        ),
        linear-gradient(
            165deg,
            #070b13 0%,
            #0b111d 48%,
            #111219 100%
        );
}

.moon {
    position: absolute;
    right: 13%;
    top: 11%;
    width: clamp(40px, 5vw, 75px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #dddacb;
    box-shadow:
        0 0 25px rgba(230,225,197,.14),
        0 0 70px rgba(220,220,200,.08);
}

.moon::after {
    content: "";
    position: absolute;
    inset: 4px 0 0 -5px;
    border-radius: 50%;
    background: #080c14;
    transform: translate(35%, -5%);
    opacity: .55;
}

.city {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 28%;
    background:
        linear-gradient(
            to top,
            #060708,
            rgba(7,8,10,.78)
        );
}

.building {
    position: absolute;
    bottom: 0;
    background: #08090a;
}

.building:nth-child(1) { left: 2%; width: 12%; height: 60%; }
.building:nth-child(2) { left: 15%; width: 17%; height: 84%; }
.building:nth-child(3) { left: 32%; width: 9%; height: 48%; }
.building:nth-child(4) { left: 42%; width: 20%; height: 73%; }
.building:nth-child(5) { left: 63%; width: 11%; height: 55%; }
.building:nth-child(6) { left: 75%; width: 19%; height: 87%; }

.building::after {
    content: "";
    position: absolute;
    inset: 10% 15%;
    opacity: .4;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(206,166,90,.22) 0 3px,
            transparent 3px 18px
        ),
        repeating-linear-gradient(
            to right,
            rgba(206,166,90,.18) 0 4px,
            transparent 4px 16px
        );
}

.city-lights {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 8% 78%, rgba(211,159,71,.5) 0 1px, transparent 2px),
        radial-gradient(circle at 17% 85%, rgba(211,159,71,.4) 0 1px, transparent 2px),
        radial-gradient(circle at 31% 72%, rgba(211,159,71,.35) 0 1px, transparent 2px),
        radial-gradient(circle at 48% 81%, rgba(211,159,71,.4) 0 1px, transparent 2px),
        radial-gradient(circle at 71% 70%, rgba(211,159,71,.35) 0 1px, transparent 2px),
        radial-gradient(circle at 87% 84%, rgba(211,159,71,.4) 0 1px, transparent 2px);
}

.window-cross-h,
.window-cross-v {
    position: absolute;
    background: rgba(20,16,13,.9);
    z-index: 3;
}

.window-cross-h {
    left: 0;
    right: 0;
    top: 57%;
    height: 10px;
}

.window-cross-v {
    top: 0;
    bottom: 0;
    left: 57%;
    width: 10px;
}

.snow {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: var(--snow-opacity);
}

.snowflake {
    position: absolute;
    top: -20px;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(238,241,237,.85);
    box-shadow: 0 0 4px rgba(255,255,255,.3);
    animation: snowfall linear infinite;
}

@keyframes snowfall {
    from {
        transform: translate3d(0, -30px, 0);
    }
    to {
        transform: translate3d(var(--drift), 110vh, 0);
    }
}

/* =========================================================
   TREE
   ========================================================= */

.tree {
    position: absolute;
    right: 9%;
    bottom: 17%;
    width: min(25vw, 360px);
    height: min(62vh, 620px);
    cursor: pointer;
    transform: translate3d(var(--tree-x, 0px), var(--tree-y, 0px), 0);
    filter: drop-shadow(25px 30px 30px rgba(0,0,0,.65));
    transition:
        transform 1.3s var(--ease-cinematic),
        filter .5s ease;
}

.tree:hover {
    filter:
        drop-shadow(25px 30px 30px rgba(0,0,0,.65))
        brightness(1.07);
}

.tree-star {
    position: absolute;
    top: 0;
    left: 50%;
    width: 24px;
    height: 24px;
    transform: translateX(-50%) rotate(45deg);
    background: #d2aa65;
    box-shadow: 0 0 25px rgba(210,170,101,.35);
    z-index: 5;
}

.tree-star::after {
    content: "";
    position: absolute;
    inset: -5px;
    border: 1px solid rgba(216,179,111,.4);
}

.tree-layer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: solid transparent;
    border-right: solid transparent;
    border-bottom: solid #102018;
    filter: drop-shadow(0 12px 9px rgba(0,0,0,.5));
}

.tree-layer.one {
    top: 35px;
    border-left-width: 65px;
    border-right-width: 65px;
    border-bottom-width: 130px;
}

.tree-layer.two {
    top: 115px;
    border-left-width: 105px;
    border-right-width: 105px;
    border-bottom-width: 170px;
}

.tree-layer.three {
    top: 225px;
    border-left-width: 145px;
    border-right-width: 145px;
    border-bottom-width: 220px;
}

.tree-trunk {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 42px;
    height: 90px;
    transform: translateX(-50%);
    background: #251810;
}

.tree-lights {
    position: absolute;
    inset: 55px 30px 75px;
    z-index: 4;
    opacity: var(--tree-light-opacity);
}

.tree-light {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #e0b768;
    box-shadow: 0 0 9px rgba(224,183,104,.7);
    animation: treePulse 4s ease-in-out infinite alternate;
}

.tree-light:nth-child(1) { left: 48%; top: 4%; animation-delay: -.2s; }
.tree-light:nth-child(2) { left: 28%; top: 22%; animation-delay: -1.4s; }
.tree-light:nth-child(3) { left: 65%; top: 29%; animation-delay: -.8s; }
.tree-light:nth-child(4) { left: 16%; top: 46%; animation-delay: -2.1s; }
.tree-light:nth-child(5) { left: 47%; top: 48%; animation-delay: -1.1s; }
.tree-light:nth-child(6) { left: 79%; top: 51%; animation-delay: -.4s; }
.tree-light:nth-child(7) { left: 30%; top: 69%; animation-delay: -2.7s; }
.tree-light:nth-child(8) { left: 61%; top: 75%; animation-delay: -1.7s; }
.tree-light:nth-child(9) { left: 12%; top: 82%; animation-delay: -.9s; }
.tree-light:nth-child(10) { left: 83%; top: 85%; animation-delay: -2.3s; }

@keyframes treePulse {
    from { opacity: .35; transform: scale(.8); }
    to { opacity: 1; transform: scale(1.15); }
}

/* =========================================================
   DESK
   ========================================================= */

.desk {
    position: absolute;
    left: -2%;
    right: -2%;
    bottom: 0;
    height: 25%;
    min-height: 155px;
    background:
        linear-gradient(
            to bottom,
            #3b2518 0%,
            #26170f 18%,
            #160d09 100%
        );
    box-shadow:
        0 -15px 45px rgba(0,0,0,.6),
        inset 0 5px 15px rgba(255,215,160,.07);
    transform: translateY(var(--desk-y, 0px));
}

.desk::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 7px;
    background: #4a2e1e;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
}

.desk::after {
    content: "";
    position: absolute;
    inset: 20% 0 0;
    opacity: .13;
    background:
        repeating-linear-gradient(
            5deg,
            transparent 0 35px,
            #080604 36px 38px
        );
}

/* =========================================================
   PHONE
   ========================================================= */

.phone {
    position: absolute;
    left: 46%;
    bottom: 20%;
    width: clamp(62px, 7vw, 100px);
    aspect-ratio: .5;
    border: 3px solid #191715;
    border-radius: 13px;
    background: #08090a;
    cursor: pointer;
    z-index: 12;
    transform:
        rotate(-8deg)
        translate3d(var(--phone-x, 0px), var(--phone-y, 0px), 0);
    box-shadow:
        0 18px 25px rgba(0,0,0,.7),
        inset 0 0 0 1px #49413a;
    transition:
        transform .5s var(--ease-cinematic),
        box-shadow .5s ease;
}

.phone:hover {
    transform:
        rotate(-8deg)
        translate3d(var(--phone-x, 0px), calc(var(--phone-y, 0px) - 3px), 0);
}

.phone-screen {
    position: absolute;
    inset: 5px;
    border-radius: 9px;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 35%, rgba(197,166,113,.08), transparent 40%),
        #090b0b;
    transition: background .6s ease;
}

.phone-speaker {
    position: absolute;
    top: 3px;
    left: 50%;
    width: 25%;
    height: 3px;
    transform: translateX(-50%);
    border-radius: 4px;
    background: #302e2a;
}

.phone-status {
    position: absolute;
    top: 13%;
    left: 0;
    right: 0;
    text-align: center;
    color: #716b61;
    font: 6px Arial, sans-serif;
    letter-spacing: .08em;
}

.phone-call-state {
    position: absolute;
    inset: 35% 0 auto;
    text-align: center;
    color: #cfc4b0;
    font: 6px Arial, sans-serif;
    letter-spacing: .12em;
    opacity: 0;
    transition: opacity .4s ease;
}

.phone-call-state strong {
    display: block;
    margin-top: 5px;
    font-size: 8px;
    font-weight: 400;
}

.phone.calling {
    animation: phoneVibrate .7s ease-in-out infinite;
    box-shadow:
        0 0 22px rgba(205,166,94,.28),
        0 18px 25px rgba(0,0,0,.7);
}

.phone.calling .phone-screen {
    background:
        radial-gradient(circle at 50% 40%, rgba(206,166,94,.28), transparent 45%),
        #17140f;
}

.phone.calling .phone-call-state {
    opacity: 1;
}

@keyframes phoneVibrate {
    0%,100% { transform: rotate(-8deg) translateX(0); }
    25% { transform: rotate(-9deg) translateX(-2px); }
    50% { transform: rotate(-7deg) translateX(2px); }
    75% { transform: rotate(-9deg) translateX(-1px); }
}

/* =========================================================
   GIFT
   ========================================================= */

.gift {
    position: absolute;
    left: 30%;
    bottom: 19%;
    width: clamp(75px, 9vw, 125px);
    height: clamp(60px, 7vw, 95px);
    cursor: pointer;
    z-index: 10;
    transform: translate3d(var(--gift-x, 0px), var(--gift-y, 0px), 0);
    transition: transform .5s var(--ease-cinematic);
}

.gift:hover {
    transform: translate3d(var(--gift-x, 0px), calc(var(--gift-y, 0px) - 4px), 0);
}

.gift-body {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 72%;
    background:
        linear-gradient(
            90deg,
            #4d1d1b,
            #642724 48%,
            #421715
        );
    box-shadow: 0 15px 20px rgba(0,0,0,.5);
}

.gift-lid {
    position: absolute;
    left: -4%;
    right: -4%;
    top: 13%;
    height: 24%;
    z-index: 2;
    background: #6b2925;
    transition: transform .8s var(--ease-cinematic);
    transform-origin: left bottom;
}

.gift-ribbon-v {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 45%;
    width: 11%;
    background: rgba(203,164,88,.68);
    z-index: 3;
}

.gift-ribbon-h {
    position: absolute;
    left: 0;
    right: 0;
    top: 48%;
    height: 13%;
    background: rgba(203,164,88,.65);
    z-index: 3;
}

.gift.open .gift-lid {
    transform: rotate(-13deg) translateY(-10px);
}

/* =========================================================
   CUP
   ========================================================= */

.cup {
    position: absolute;
    left: 61%;
    bottom: 20%;
    width: 50px;
    height: 45px;
    border-radius: 4px 4px 15px 15px;
    background: #c4b59a;
    box-shadow: 0 12px 18px rgba(0,0,0,.55);
    z-index: 9;
}

.cup::before {
    content: "";
    position: absolute;
    left: 7px;
    right: 7px;
    top: 5px;
    height: 10px;
    border-radius: 50%;
    background: #251913;
}

.cup::after {
    content: "";
    position: absolute;
    right: -13px;
    top: 10px;
    width: 16px;
    height: 21px;
    border: 5px solid #a99a82;
    border-left: 0;
    border-radius: 0 13px 13px 0;
}

.steam {
    position: absolute;
    top: -28px;
    left: 20px;
    width: 2px;
    height: 27px;
    opacity: .12;
    background: linear-gradient(to top, transparent, #e6ddca);
    animation: steam 3.8s ease-in-out infinite;
}

.steam.two {
    left: 31px;
    animation-delay: -1.8s;
}

@keyframes steam {
    0%,100% { transform: translateY(4px) scaleX(1); opacity: .08; }
    50% { transform: translateY(-6px) scaleX(2); opacity: .22; }
}

/* =========================================================
   CLOCK
   ========================================================= */

.clock {
    position: absolute;
    left: 18%;
    bottom: 20%;
    width: clamp(52px, 6vw, 78px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 4px solid #403328;
    background: #d7c8ab;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 12px 20px rgba(0,0,0,.55);
    transform: translate3d(var(--clock-x, 0px), var(--clock-y, 0px), 0);
}

.clock::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 1px solid rgba(50,35,23,.4);
}

.clock-hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    width: 2px;
    height: 30%;
    background: #30251d;
    transform-origin: bottom center;
}

.clock-hand.hour {
    transform: translateX(-50%) rotate(118deg);
}

.clock-hand.minute {
    height: 38%;
    transform: translateX(-50%) rotate(350deg);
}

.clock-center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #3c2b1e;
    transform: translate(-50%, -50%);
}

/* =========================================================
   FILM GRAIN / VIGNETTE
   ========================================================= */

.grain {
    position: fixed;
    inset: 0;
    z-index: 80;
    pointer-events: none;
    opacity: .085;
    mix-blend-mode: screen;
    background-image:
        repeating-radial-gradient(
            circle at 20% 30%,
            transparent 0,
            rgba(255,255,255,.18) 1px,
            transparent 2px,
            transparent 4px
        );
    background-size: 7px 7px;
    animation: grainMove .18s steps(2) infinite;
}

@keyframes grainMove {
    0% { transform: translate(0,0); }
    25% { transform: translate(1%, -1%); }
    50% { transform: translate(-1%, 1%); }
    75% { transform: translate(1%, 1%); }
    100% { transform: translate(-1%, -1%); }
}

.vignette {
    position: fixed;
    inset: 0;
    z-index: 70;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.28) 72%,
            rgba(0,0,0,.8) 100%
        );
}

/* =========================================================
   TOP LABEL
   ========================================================= */

.scene-label {
    position: fixed;
    top: max(24px, env(safe-area-inset-top));
    left: 30px;
    z-index: 90;
    color: rgba(225,213,191,.45);
    font: 9px Arial, sans-serif;
    letter-spacing: .28em;
}

/* =========================================================
   FULLSCREEN
   ========================================================= */

.fullscreen-button {
    position: fixed;
    top: max(22px, env(safe-area-inset-top));
    right: 26px;
    z-index: 140;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(215,187,142,.18);
    border-radius: 50%;
    background: rgba(10,8,7,.48);
    color: rgba(229,216,193,.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    font: 22px/1 Arial, sans-serif;
    transition: background .3s ease, border-color .3s ease, transform .3s ease;
}

.fullscreen-button:hover {
    background: rgba(35,27,20,.72);
    border-color: rgba(215,187,142,.45);
    transform: scale(1.05);
}

@media (max-width: 480px) {
    .fullscreen-button {

    letter-spacing: .025em;

.progress-fill {

    place-items: center;
    padding: 25px;
    background: rgba(2,2,2,.58);
    backdrop-filter: blur(5px);

    opacity: 0;
    visibility: hidden;
    transition: opacity .55s ease, visibility .55s;
}

.modal-backdrop.visible {
    opacity: 1;
    visibility: visible;
}

.modal {
    width: min(88vw, 430px);
    padding: 34px 32px 28px;
    border: 1px solid rgba(210,181,136,.16);

}

.modal-kicker {

/* ==========================================================
   HELPERS
   ========================================================== */

function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) {
        return "00:00";
    }

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
}


/* ==========================================================
   SNOW
   Lightweight snow particles.
   ========================================================== */

function createSnow() {

    const count = window.innerWidth < 600 ? 28 : 48;

    snow.innerHTML = "";

    for (let i = 0; i < count; i++) {

        const flake = document.createElement("span");

        flake.className = "snowflake";

        const size = Math.random() * 2 + 1;
        const left = Math.random() * 100;
        const duration = Math.random() * 12 + 10;
        const delay = Math.random() * -20;
        const drift = (Math.random() * 100 - 50) + "px";

        flake.style.left = left + "%";
        flake.style.width = size + "px";
        flake.style.height = size + "px";
        flake.style.opacity = String(Math.random() * .7 + .2);
        flake.style.animationDuration = duration + "s";
        flake.style.animationDelay = delay + "s";
        flake.style.setProperty("--drift", drift);

        snow.appendChild(flake);
    }
}


/* ==========================================================
   LYRICS
   EDIT YOUR LYRICS IN CONFIG.lyrics ABOVE.
   ========================================================== */

function buildLyrics() {

    lyricsContainer.innerHTML = "";

    CONFIG.lyrics.forEach((lyric, index) => {

        const line = document.createElement("div");

        line.className = "lyric-line";
        line.dataset.index = String(index);
        line.textContent = lyric.text;

        lyricsContainer.appendChild(line);
    });
}


function updateLyrics(time) {

    if (!CONFIG.lyrics.length) {
        return;
    }

    let newIndex = -1;

    for (let i = 0; i < CONFIG.lyrics.length; i++) {

        if (time >= CONFIG.lyrics[i].time) {
            newIndex = i;
        } else {
            break;
        }
    }

    if (newIndex === currentLyricIndex) {
        return;
    }

    currentLyricIndex = newIndex;

    const lines = lyricsContainer.querySelectorAll(".lyric-line");

    lines.forEach((line, index) => {

        line.classList.remove("active", "past");

        if (index === newIndex) {
            line.classList.add("active");
        }

        if (index < newIndex) {
            line.classList.add("past");
        }
    });
}


function resetLyrics() {

    currentLyricIndex = -1;

    const lines = lyricsContainer.querySelectorAll(".lyric-line");

    lines.forEach(line => {
        line.classList.remove("active", "past");
    });
}


/* ==========================================================
   AUDIO
   ========================================================== */

audio.volume = Number(volume.value);


function updatePlayer() {

    const duration = audio.duration;

    currentTimeElement.textContent = formatTime(audio.currentTime);

    if (Number.isFinite(duration)) {
        durationElement.textContent = formatTime(duration);
    } else {
        durationElement.textContent = "00:00";
    }

    let progress = 0;

    if (Number.isFinite(duration) && duration > 0) {
        progress = (audio.currentTime / duration) * 100;
    }

    progress = clamp(progress, 0, 100);

    progressFill.style.width = progress + "%";
    progressKnob.style.left = progress + "%";

    progressTrack.setAttribute(
        "aria-valuenow",
        String(Math.round(progress))
    );

    updateLyrics(audio.currentTime);
}


function updatePlayButton() {

    if (audio.paused) {
        playButton.textContent = "▶";
        playButton.setAttribute("aria-label", "Play");
        playButton.title = "Play";
    } else {
        playButton.textContent = "Ⅱ";
        playButton.setAttribute("aria-label", "Pause");
        playButton.title = "Pause";
    }
}


async function playAudio() {

    try {
        await audio.play();
    } catch (error) {
        /*
         * Browser autoplay restrictions are intentionally respected.
         * The user can use the visible PLAY button.
         */
        console.log("Playback requires user interaction.");
    }
}


function togglePlay() {

    if (audio.paused) {
        playAudio();
    } else {
        audio.pause();
    }
}


function restartAudio() {

    audio.pause();

    audio.currentTime = 0;

    resetLyrics();

    phoneTriggered = false;
    endingTriggered = false;

    phone.classList.remove("calling");

    scene.classList.remove(
        "phase-2",
        "phase-3",
        "phase-4",
        "phase-5"
    );

    scene.classList.add("phase-1");

    playAudio();
}


/* ==========================================================
   AUDIO PROGRESS CLICK / KEYBOARD
   ========================================================== */

function seekFromPointer(event) {

    if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
        return;
    }

    const rect = progressTrack.getBoundingClientRect();

    const position =
        clamp(
            (event.clientX - rect.left) / rect.width,
            0,
            1
        );

    audio.currentTime = position * audio.duration;
}


function seekFromKeyboard(event) {

    if (!Number.isFinite(audio.duration)) {
        return;
    }

    let percentage =
        audio.duration > 0
            ? audio.currentTime / audio.duration
            : 0;

    if (event.key === "ArrowRight") {
        percentage += .05;
    }

    if (event.key === "ArrowLeft") {
        percentage -= .05;
    }

    if (
        event.key === "ArrowRight" ||
        event.key === "ArrowLeft"
    ) {
        event.preventDefault();

        audio.currentTime =
            clamp(percentage, 0, 1) * audio.duration;
    }

    if (event.key === "Home") {
        event.preventDefault();
        audio.currentTime = 0;
    }

    if (event.key === "End") {
        event.preventDefault();
        audio.currentTime = audio.duration;
    }
}


/* ==========================================================
   INTERACTIVE MODAL SYSTEM
   ========================================================== */

function showModal(kicker, message, actions = []) {

    modalKicker.textContent = kicker;
    modalMessage.textContent = message;

    modalActions.innerHTML = "";

    if (!actions.length) {

        const close = document.createElement("button");

        close.className = "modal-button";
        close.type = "button";
        close.textContent = "CLOSE";

        close.addEventListener("click", closeModal);

        modalActions.appendChild(close);

    } else {

        actions.forEach(action => {

            const button = document.createElement("button");

            button.className = "modal-button";
            button.type = "button";
            button.textContent = action.label;

            button.addEventListener("click", () => {

                if (typeof action.onClick === "function") {
                    action.onClick();
                }
            });

            modalActions.appendChild(button);
        });
    }

    modalBackdrop.classList.add("visible");
    modalBackdrop.setAttribute("aria-hidden", "false");

    requestAnimationFrame(() => {
        const firstButton =
            modalActions.querySelector("button");

        if (firstButton) {
            firstButton.focus();
        }
    });
}


function closeModal() {

    modalBackdrop.classList.remove("visible");
    modalBackdrop.setAttribute("aria-hidden", "true");

    if (typeof activeModalCloseAction === "function") {
        const action = activeModalCloseAction;
        activeModalCloseAction = null;
        action();
    }
}


modalClose.addEventListener("click", closeModal);


modalBackdrop.addEventListener("click", event => {

    if (event.target === modalBackdrop) {
        closeModal();
    }
});


document.addEventListener("keydown", event => {

    if (
        event.key === "Escape" &&
        modalBackdrop.classList.contains("visible")
    ) {
        closeModal();
    }
});

/* ==========================================================
   SONG PROGRESSION
   ========================================================== */

function updateSongProgress() {

    if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
        return;
    }

    const progress =
        clamp(
            audio.currentTime / audio.duration,
            0,
            1
        );

    /*
     * 0–20%
     * Room very dark.
     */
    if (progress < .20) {

        scene.classList.remove(
            "phase-2",
            "phase-3",
            "phase-4",
            "phase-5"
        );

        scene.classList.add("phase-1");
    }

    /*
     * 20–45%
     * Christmas lights become visible.
     */
    else if (progress < .45) {

        scene.classList.remove(
            "phase-1",
            "phase-3",
            "phase-4",
            "phase-5"
        );

        scene.classList.add("phase-2");
    }

    /*
     * 45–70%
     * Room becomes warmer.
     */
    else if (progress < .70) {

        scene.classList.remove(
            "phase-1",
            "phase-2",
            "phase-4",
            "phase-5"
        );

        scene.classList.add("phase-3");
    }

    /*
     * 70–90%
     * Room gets colder.
     * Phone interaction becomes active.
     */
    else if (progress < .90) {

        scene.classList.remove(
            "phase-1",
            "phase-2",
            "phase-3",
            "phase-5"
        );

        scene.classList.add("phase-4");
    }

    /*
     * 90–100%
     * Darkness.
     */
    else {

        scene.classList.remove(
            "phase-1",
            "phase-2",
            "phase-3",
            "phase-4"
        );

        scene.classList.add("phase-5");
    }


    /* ======================================================
       PHONE EVENT
       ====================================================== */

    if (
        progress >= CONFIG.phoneTriggerProgress &&
        !phoneTriggered
    ) {

        phoneTriggered = true;

        phone.classList.add("calling");
    }


    /* ======================================================
       ENDING EVENT
       ====================================================== */

    if (
        progress >= CONFIG.endingTriggerProgress &&
        !endingTriggered
    ) {

        endingTriggered = true;

        beginEnding();
    }
}


/* ==========================================================
   ANIMATION LOOP
   ========================================================== */

function animationLoop(timestamp) {

    if (!lastFrame) {
        lastFrame = timestamp;
    }

    /*
     * Keep the visual update lightweight.
     * Audio itself remains the source of truth.
     */
    if (timestamp - lastFrame > 50) {

        updatePlayer();
        updateSongProgress();

        lastFrame = timestamp;
    }

    requestAnimationFrame(animationLoop);
}


/* ==========================================================
   DESKTOP PARALLAX
   ========================================================== */

function setupParallax() {

    if (prefersReducedMotion) {
        return;
    }

    if (window.innerWidth <= 800) {
        return;
    }

    window.addEventListener("mousemove", event => {

        const x =
            (event.clientX / window.innerWidth - .5);

        const y =
            (event.clientY / window.innerHeight - .5);

        const cameraX = x * -9;
        const cameraY = y * -6;

        const windowX = x * 4;
        const windowY = y * 3;

        const treeX = x * -5;
        const treeY = y * -3;

        const deskY = y * -2;

        scene.style.setProperty(
            "--camera-x",
            cameraX.toFixed(2) + "px"
        );

        scene.style.setProperty(
            "--camera-y",
            cameraY.toFixed(2) + "px"
        );

        scene.style.setProperty(
            "--window-x",
            windowX.toFixed(2) + "px"
        );

        scene.style.setProperty(
            "--window-y",
            windowY.toFixed(2) + "px"
        );

        scene.style.setProperty(
            "--tree-x",
            treeX.toFixed(2) + "px"
        );

        scene.style.setProperty(
            "--tree-y",
            treeY.toFixed(2) + "px"
        );

        scene.style.setProperty(
            "--desk-y",
            deskY.toFixed(2) + "px"
        );
    });
}

/* ==========================================================
   ENDING
   ========================================================== */

function beginEnding() {

    if (endingRunning) {
        return;
    }

    endingRunning = true;

    /*
     * Stop normal interaction.
     */
    phone.classList.remove("calling");

    document.body.style.cursor = "default";

    /*
     * Make room disappear.
     */
    scene.classList.add("phase-5");

    /*
     * Stop the music at the end of the experience.
     */
    audio.pause();

    /*
     * Fade out player and lyrics.
     */
    document.querySelector(".player").style.transition =
        "opacity 1.5s ease";

    document.querySelector(".player").style.opacity = "0";

    lyricsContainer.style.transition =
        "opacity 1.2s ease";

    lyricsContainer.style.opacity = "0";

    /*
     * Fade the scene.
     */
    setTimeout(() => {

        ending.classList.add("active");

    }, prefersReducedMotion ? 200 : 1100);


    /*
     * Phone lights up.
     */
    endingPhone.style.opacity = "1";


    /*
     * After a quiet moment, phone disappears.
     */
    setTimeout(() => {

        endingPhone.style.opacity = "0";

    }, prefersReducedMotion ? 500 : 2200);


    /*
     * Final message.
     */
    setTimeout(() => {

        endingCopy.classList.add("show");

        replayButton.focus();

    }, prefersReducedMotion ? 800 : 3700);
}


/* ==========================================================
   REPLAY
   ========================================================== */

function replayExperience() {

    ending.classList.remove("active");
    endingCopy.classList.remove("show");

    endingPhone.style.opacity = "1";

    audio.pause();
    audio.currentTime = 0;

    currentLyricIndex = -1;

    phoneTriggered = false;
    endingTriggered = false;
    endingRunning = false;
    giftOpened = false;
    windowFocused = false;

    phone.classList.remove("calling");

    gift.classList.remove("open");

    scene.classList.remove(
        "phase-2",
        "phase-3",
        "phase-4",
        "phase-5",
        "window-focus"
    );

    scene.classList.add("phase-1");

    lyricsContainer.style.opacity = "1";

    document.querySelector(".player").style.opacity = "1";

    resetLyrics();
    updatePlayer();

    /*
     * Give the new scene a moment before attempting playback.
     * The replay button itself is a user gesture.
     */
    setTimeout(() => {
        playAudio();
    }, prefersReducedMotion ? 0 : 500);
}


replayButton.addEventListener("click", replayExperience);


/* ==========================================================
   TOUCH / MOBILE DISCOVERY
   ========================================================== */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", event => {

    if (!event.touches.length) {
        return;
    }

    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;

}, { passive: true });


document.addEventListener("touchmove", event => {

    /*
     * Prevent accidental horizontal page movement.
     * The document is already overflow-hidden, but this keeps
     * the scene stable on mobile browsers.
     */
    if (!event.touches.length) {
        return;
    }

    const dx =
        Math.abs(event.touches[0].clientX - touchStartX);

    const dy =
        Math.abs(event.touches[0].clientY - touchStartY);

    if (dx > dy && dx > 10) {
        event.preventDefault();
    }

}, { passive: false });


/* ==========================================================
   INITIALIZATION
   ========================================================== */

function initialize() {

    /*
     * Make sure the required local audio path is explicit.
     */
    audio.setAttribute("src", CONFIG.audioFile);

    createSnow();

    buildLyrics();

    updatePlayButton();

    updatePlayer();

    setupParallax();

    /*
     * Hide hint after a few seconds even if user does nothing.
     */
    setTimeout(() => {
        discoveryHint.classList.add("hidden");
    }, 5000);
}


window.addEventListener("resize", () => {

    if (window.innerWidth <= 800) {
        scene.style.setProperty("--camera-x", "0px");
        scene.style.setProperty("--camera-y", "0px");
    }

    createSnow();
});


/* ==========================================================
   START
   ========================================================== */

initialize();

requestAnimationFrame(animationLoop);

</script>
